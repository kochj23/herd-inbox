# CI pipeline — lint + type check + test + coverage gates.
#
# Closes issue #3 (CI/CD Pipeline). Implements CLAUDE.md "Phase 1 MVP" gate:
# all tests must pass + 100% coverage on src/herd_inbox/security.py + >80% overall
# before any PR can be approved.
#
# ── Security hardening (apply to every workflow in this repo) ──
# 1. Actions pinned to commit SHA (NOT floating tags) — supply-chain defense.
#    To rotate: GET github.com/<owner>/<repo>/releases/latest → resolve tag SHA.
# 2. Top-level `permissions: contents: read` — minimal default; escalate per-job.
# 3. `pull_request` (not `pull_request_target`) — fork PRs do NOT receive secrets.
# 4. `concurrency` cancels in-progress on PR force-push (cost + clutter).
# 5. `timeout-minutes` on every job — prevents stuck jobs draining minutes.
# 6. No `${{ github.event.* }}` strings interpolated into shell — workflow injection.
# 7. `actions/checkout` with `persist-credentials: false` — token doesn't linger.
# 8. `set -euo pipefail` in all multi-line shell — fail-fast on errors.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"
          # Cache disabled on lint job — minimal install, low value. Removes a
          # cross-PR cache-poisoning surface (Silas MED finding).
          enable-cache: false

      - name: Install ruff (pinned exact version, not a range — supply-chain hardening)
        run: uv pip install --system "ruff==0.8.6"

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"
          # Cache only on push-to-main; on fork PRs, no cache to avoid poisoning.
          enable-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install project + type stubs
        run: |
          set -euo pipefail
          uv pip install --system -e ".[dev]"
          uv pip install --system types-bleach types-Markdown

      - name: mypy
        run: mypy src/herd_inbox/

  test:
    name: Tests + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"
          # Cache only on push-to-main; on fork PRs, no cache to avoid poisoning.
          enable-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest with coverage
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=herd_inbox \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Enforce 100% coverage on security module (per CLAUDE.md)
        run: |
          set -euo pipefail
          # Mandatory: 100% coverage on the security module. After PR #10 lands,
          # security.py is permanent — there is no scenario where it should be
          # absent on main. A PR that deletes it MUST fail CI here, not silently
          # pass. (Pre-#10 fallback removed per Silas finding "coverage gate
          # bypassable from a fork PR".)
          test -f src/herd_inbox/security.py || {
            echo "::error::src/herd_inbox/security.py is missing — security gate cannot run"
            exit 1
          }
          test -f tests/test_security.py || {
            echo "::error::tests/test_security.py is missing — security gate cannot run"
            exit 1
          }
          pytest tests/test_security.py \
            --cov=herd_inbox.security \
            --cov-fail-under=100 \
            -q

      - name: Enforce >80% overall coverage (per CLAUDE.md)
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=herd_inbox \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage XML as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v6.1.0
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
